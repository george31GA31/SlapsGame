<main class="preferences-card">
<h1>Settings</h1>
<fieldset>
<legend>Menu appearance</legend>
<label class="theme-choice">
<input type="radio" name="theme" value="dark"> Dark</label>
<label class="theme-choice">
<input type="radio" name="theme" value="light"> Light</label>
</fieldset>
<p class="preference-help">Saved on this device. Matches always use the green playing area.</p>
<p id="settings-status" role="status">
</p>
<script>document.querySelectorAll('[name="theme"]').forEach(input=>{input.checked=input.value===ISFPreferences.getTheme();input.addEventListener('change',()=>{ISFPreferences.setTheme(input.value);document.getElementById('settings-status').textContent='Appearance saved.';});});</script>
